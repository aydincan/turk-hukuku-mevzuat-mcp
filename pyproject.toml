[project]
name = "turk-hukuku-mevzuat-mcp"
version = "0.1.1"
description = "Türk mevzuatının resmî güncel metnini (mevzuat.gov.tr) yapay zekâ araçlarına açan MCP sunucusu."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aydın Can Polatkan" }]
keywords = ["mcp", "turkish-law", "mevzuat", "turk-hukuku", "llm"]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pypdf>=4.0",
]

[project.scripts]
turk-hukuku-mevzuat = "turk_hukuku_mevzuat.server:main"

[project.urls]
Homepage = "https://turk-hukuku.com"
Documentation = "https://turk-hukuku.com/mcp/"
Repository = "https://github.com/aydincan/turk-hukuku-mevzuat-mcp"
Issues = "https://github.com/aydincan/turk-hukuku-mevzuat-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turk_hukuku_mevzuat"]
